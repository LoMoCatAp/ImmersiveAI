<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="katex.min.css">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    #formula { box-sizing: border-box; width: 100%; padding: 4px 10px; color: #18202A; font-size: 16px; overflow-x: auto; }
    #formula.display { text-align: center; }
    #formula .katex-display { margin: 0; }
    #formula .error { color: #C33D45; font-family: monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="formula"></div>
  <script src="katex.min.js"></script>
  <script>
    window.renderFormula = function (source, display, dark, fontSize) {
      var target = document.getElementById('formula');
      target.className = display ? 'display' : '';
      target.style.color = dark ? '#E8EDF5' : '#18202A';
      target.style.fontSize = (fontSize || 16) + 'px';
      try {
        katex.render(source, target, {
          displayMode: display,
          throwOnError: false,
          strict: 'ignore',
          trust: false
        });
      } catch (error) {
        target.className = 'error';
        target.textContent = source;
      }
    };
  </script>
</body>
</html>
